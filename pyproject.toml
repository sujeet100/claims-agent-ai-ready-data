[project]
name = "claims-ai-ready"
version = "0.1.0"
description = "AI-ready enterprise data, shown on one motor-insurance claim: before and after the six layers"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dagster>=1.11",
    "dagster-webserver>=1.11",
    "pyiceberg[sql-sqlite,pyarrow]>=0.9",
    "duckdb>=1.3",
    "pyarrow>=18",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "neo4j>=5.26",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
    "fpdf2>=2.8",
    "pypdf>=5.0",
    "rapidfuzz>=3.10",
    "faker>=30",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic-ai-slim[openai,anthropic,mcp]>=1.0",
    "mcp>=1.10",
    "pyyaml>=6",
    "tabulate>=0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claims"]

[tool.dagster]
module_name = "claims.pipeline.definitions"
